<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CyberTrace Login</title>
<style>body{font:16px system-ui;background:#101820;color:#e9f0f3;display:grid;place-items:center;min-height:100vh;margin:0}.card{width:min(360px,90vw);padding:2rem;background:#1c2a35;border-radius:12px}label{display:block;margin:.8rem 0 .25rem}input{box-sizing:border-box;width:100%;padding:.7rem}button{margin-top:1rem;padding:.7rem 1rem}p.error{color:#ff9d9d}</style></head>
<body><main class="card"><h1>CyberTrace</h1><p>Sign in to review security events.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('login_submit') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form></main></body></html>
